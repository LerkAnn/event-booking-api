services:
    sqlserver:
        image: mcr.microsoft.com/mssql/server:2025-latest
        container_name: sql-compose
        environment:
            ACCEPT_EULA: "Y"
            MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
        ports:
            - "1434:1433"
        volumes:
            - sqldata:/var/opt/mssql

volumes:
    sqldata:
